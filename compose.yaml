services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_ops
      POSTGRES_PASSWORD: agent_ops
      POSTGRES_DB: agent_ops
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_ops -d agent_ops']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
